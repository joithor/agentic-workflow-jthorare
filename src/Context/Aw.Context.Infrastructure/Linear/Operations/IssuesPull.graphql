query IssuesPull($filter: IssueFilter, $first: Int, $after: String) {
  issues(filter: $filter, first: $first, after: $after, orderBy: updatedAt) {
    nodes {
      id identifier title description url createdAt updatedAt completedAt canceledAt
      state { name type }
      team { id key name }
      creator { id name }
      project { id name }
      parent { id identifier title }
      relations(first: 25) { nodes { type relatedIssue { id identifier title } } }
      inverseRelations(first: 25) { nodes { type issue { id identifier title } } }
    }
    pageInfo { hasNextPage endCursor }
  }
}
